name: Playwright2 Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run POST tests
      run: npx playwright tests/POST_add_pet.spec.ts
    - name: Run GET tests
      run: npx playwright tests/GET_pet_byID.spec.ts
    - name: Run PUT tests
      run: npx playwright tests/PUT_Update_byID.spec.ts
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
